# Attach ONLY the API to an existing database network. No database host port needed.
# docker compose -f compose.yaml -f compose.private-network.yaml up -d --build
services:
  api:
    networks:
      web: {}
      database-network: {}
networks:
  database-network:
    external: true
    name: ${DATABASE_NETWORK:?Set DATABASE_NETWORK to the existing stack network name}
