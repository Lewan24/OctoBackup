map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /tmp/tls/server.crt;
    ssl_certificate_key /tmp/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = /health {
        access_log off;
        return 200 'ok';
    }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Synchronous backup endpoints may run up to the provider's 30-minute limit.
        proxy_read_timeout 1900s;
    }
    location /backuphub {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
