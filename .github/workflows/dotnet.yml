name: Build and security checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: dotnet restore OctoBackup.sln
      - run: dotnet build OctoBackup.sln --no-restore
      - run: dotnet test Backend/tests/OctoBackup.Tests --no-build
      - run: npm ci --prefix Frontend
      - run: npm audit --prefix Frontend
      - run: npm test --prefix Frontend
      - run: npm run build --prefix Frontend
      - run: node Frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run test:e2e --prefix Frontend
